syntax="proto3";


option java_multiple_files=true;
option java_package="com.patientmangement.billing";
option java_outer_classname="billing";



service BillingService{

  rpc CreateBillingAccount(CreateBillingAccountRequest) returns (CreatedBillingAccountResponse);

}

message CreateBillingAccountRequest{
  string patientId=1;
  string name=2;
  string email=3;
}

message CreatedBillingAccountResponse{
  string accountId=1;
  string status=2;
}


