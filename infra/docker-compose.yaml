services:

  patient-db:
    image: postgres:16
    container_name: patient-db
    restart: always
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: patientuser
      POSTGRES_PASSWORD: PASS
    ports:
      - "2000:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patientuser -d patientdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  kafka-ui:
      image: ghcr.io/kafbat/kafka-ui:latest
      container_name: kafka-ui
      ports:
        - "8080:8080"
      depends_on:
        kafka:
          condition: service_started
      environment:
        DYNAMIC_CONFIG_ENABLED: 'true'
        KAFKA_CLUSTERS_0_NAME: 'local-cluster'
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'

  billing-service:
    build:
      context: ../billing-service
      dockerfile: Dockerfile
    container_name: "billing-service"
    ports:
      - "8081:8081"
      - "4001:4001"




  patient-service:
    build:
      context: ../patient-service
      dockerfile: Dockerfile
    container_name: "patient-service"
    ports:
      - "4000:8080"
    depends_on:
       kafka:
         condition: service_started
       billing-service:
        condition: service_started
       patient-db:
          condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patientdb
      SPRING_DATASOURCE_USERNAME: patientuser
      SPRING_DATASOURCE_PASSWORD: PASS
      SPRING_GRPC_CLIENT_CHANNELS_BILLING_CHANNEL_ADDRESS: billing-service:4001
      SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_ADDRESS: "billing-service:4001"
      SPRING_GRPC_CLIENT_CHANNELS_BILLING_CHANNEL_NEGOTIATION_TYPE: "plaintext"

  analytics-service:
    build:
      context: ../analytics-service
      dockerfile:  Dockerfile
    container_name: "analytics-service"
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8002:8080"


  gateway-service:
    build:
      context: ../gateway
      dockerfile: Dockerfile

    ports:
      - "7000:7000"
    depends_on:
      patient-service:
        condition: service_started

volumes:
  patient-db-data:
    driver: local